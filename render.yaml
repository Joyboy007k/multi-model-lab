services:
  - type: web
    name: multi-model-lab
    runtime: python
    plan: free
    buildCommand: "echo 'no build needed (stdlib only)'"
    startCommand: "python app.py"
    healthCheckPath: /health
    envVars:
      - key: BRIDGE_API_KEY
        sync: false
      - key: GEMINI_API_KEY
        sync: false
      - key: GROQ_API_KEY
        sync: false
      - key: OPENROUTER_API_KEY
        sync: false
      - key: ANTHROPIC_API_KEY
        sync: false
      - key: CLAUDE_MODEL
        value: claude-sonnet-5-5
      - key: GEMINI_MODEL
        value: gemini-2.0-flash
      - key: GROQ_MODEL
        value: openai/gpt-oss-120b
      - key: OPENROUTER_MODEL
        value: google/gemma-3-27b-it:free
